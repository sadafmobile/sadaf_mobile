<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صدف موبایل</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050824;--card:#0b1138;--ink:#eaf2ff;--mute:#9fb3e8;--c1:#22d3ee;--c2:#c04cff}
:root[data-theme="light"]{--bg:#050824}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at top,#15207a 0,var(--bg) 55%);background-color:var(--bg);color:var(--ink);font-family:Tahoma,"Vazirmatn","Segoe UI",sans-serif;min-height:100vh}
.w{max-width:460px;margin:0 auto;padding:20px 16px 32px}
.logo{display:block;width:230px;max-width:70%;margin:0 auto;border-radius:12px}
.tag{text-align:center;margin:6px 0 22px;font-size:17px;font-weight:700;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
a.b{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;background:var(--card);border:1.5px solid transparent;border-radius:18px;background-image:linear-gradient(var(--card),var(--card)),linear-gradient(120deg,var(--c1),var(--c2));background-origin:border-box;background-clip:padding-box,border-box;color:inherit;text-decoration:none;box-shadow:0 0 18px rgba(80,90,255,.25)}
a.b:active{transform:scale(.98)}
a.b:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
.i{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--c2);box-shadow:0 0 12px rgba(192,76,255,.5)}
.i svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{display:flex;flex-direction:column;gap:2px;min-width:0}
.t small{color:var(--mute);font-size:13px}
.t b{font-size:19px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.h{margin-top:18px;padding:16px;border:1.5px solid #2b3aa8;border-radius:18px;text-align:center;background:var(--card)}
.h h2{margin:0 0 8px;font-size:17px;color:var(--c1)}
.h p{margin:4px 0;font-size:16px}
</style>
</head>
